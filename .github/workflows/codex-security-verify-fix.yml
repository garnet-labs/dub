name: Codex Security verify-fix

# Runs Codex Security's own verify-fix step on the pull request head, after
# Garnet has posted the Execution Profile for that head. AGENTS.md and
# SECURITY.md tell the verifier to read that record before calling a fix
# verified. The finding under verification is the text between two lines of
# the pull request description that consist solely of the markers
# `<!-- codex-security:finding:start -->` and `<!-- codex-security:finding:end -->`.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - ".garnet-demo/runtime-review/**"
      - "apps/web/lib/webhook/preview.ts"
      - "apps/web/app/api/webhooks/preview/**"
      - ".github/workflows/deepsec-review.yml"
      - ".github/workflows/codex-security-verify-fix.yml"
      - "AGENTS.md"
      - "SECURITY.md"

permissions: {}

concurrency:
  group: codex-security-verify-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Codex Security verify-fix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read the finding from the pull request description
        id: finding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
          awk '/^<!-- codex-security:finding:start -->$/{flag=1; next} /^<!-- codex-security:finding:end -->$/{flag=0} flag' \
            "$RUNNER_TEMP/pr-body.md" > "$RUNNER_TEMP/finding.md"
          if [ -s "$RUNNER_TEMP/finding.md" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No finding in the pull request description; nothing to verify."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.finding.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Install Codex Security
        if: steps.finding.outputs.present == 'true'
        run: npm install -g --no-fund --no-audit @openai/codex-security@0.1.26

      # Codex talks to the Vercel AI Gateway through a provider entry in its own
      # config; OPENAI_BASE_URL is not read by the bundled Codex.
      - name: Point Codex at the Vercel AI Gateway
        if: steps.finding.outputs.present == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'EOF'
          model = "openai/gpt-5.6-terra"
          model_provider = "vercel-ai-gateway"

          [model_providers.vercel-ai-gateway]
          name = "Vercel AI Gateway"
          base_url = "https://ai-gateway.vercel.sh/v1"
          env_key = "AI_GATEWAY_API_KEY"
          wire_api = "responses"
          EOF
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"

      # Garnet's App posts the Execution Profile a short while after the
      # "DeepSec review" job ends. Wait for the record bound to this head and
      # mirror it where AGENTS.md says the verifier will find it.
      - name: Wait for the Execution Profile bound to this head
        if: steps.finding.outputs.present == 'true'
        id: profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .garnet
          for _ in $(seq 1 90); do
            gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.body | contains("<!-- garnet-runtime-review -->")) | .body' > "$RUNNER_TEMP/garnet-comments.md"
            if grep -q "<!-- garnet:commit $HEAD_SHA -->" "$RUNNER_TEMP/garnet-comments.md" \
               && grep -q "<!-- garnet-control-plane-pr-comment:v1" "$RUNNER_TEMP/garnet-comments.md"; then
              cp "$RUNNER_TEMP/garnet-comments.md" .garnet/runtime-review.md
              echo "state=recorded" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          if grep -q "<!-- garnet:commit $HEAD_SHA -->" "$RUNNER_TEMP/garnet-comments.md"; then
            cp "$RUNNER_TEMP/garnet-comments.md" .garnet/runtime-review.md
            echo "state=pending" >> "$GITHUB_OUTPUT"
          else
            printf 'No Garnet Execution Profile comment is bound to head %s.\n' "$HEAD_SHA" > .garnet/runtime-review.md
            echo "state=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Run codex-security verify-fix
        if: steps.finding.outputs.present == 'true'
        id: verify
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          codex-security verify-fix "$RUNNER_TEMP/finding.md" \
            --effort high \
            --codex 'model="openai/gpt-5.6-terra"' \
            --codex 'analytics.enabled=false' \
            --format json > "$RUNNER_TEMP/verify-fix.json" 2> "$RUNNER_TEMP/verify-fix.log"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/verify-fix.log"
          cat "$RUNNER_TEMP/verify-fix.json"

      - name: Post the verify-fix result on the pull request
        if: steps.finding.outputs.present == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
          PROFILE_STATE: ${{ steps.profile.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs");
            const tmp = process.env.RUNNER_TEMP;
            const head = process.env.HEAD_SHA;
            const read = (f) => fs.existsSync(f) ? fs.readFileSync(f, "utf8").trim() : "";
            let results = [];
            try { results = JSON.parse(read(`${tmp}/verify-fix.json`)).results ?? []; } catch {}
            const log = read(`${tmp}/verify-fix.log`);
            const exit = process.env.VERIFY_STATUS;
            const profile = {
              recorded: `Execution Profile bound to \`${head.slice(0, 7)}\` was on the pull request before verification`,
              pending: `Execution Profile for \`${head.slice(0, 7)}\` was still recording; verifier saw the pending comment`,
              missing: `No Execution Profile bound to \`${head.slice(0, 7)}\` when verification ran`,
            }[process.env.PROFILE_STATE] ?? "Execution Profile state unknown";
            const rows = results.length
              ? results.map((r) => `| \`${r.id}\` | **${r.status}** | ${String(r.evidence ?? "").replace(/\|/g, "\\|").replace(/\n+/g, " ")} |`).join("\n")
              : `| — | **no result** (exit ${exit}) | ${log ? "`" + log.replace(/\s+/g, " ").slice(-600) + "`" : "the verifier produced no output"} |`;
            const body = [
              "<!-- codex-security-verify-fix -->",
              `## Codex Security verify-fix · \`${head.slice(0, 7)}\``,
              "",
              "| Finding | Status | Evidence |",
              "|---|---|---|",
              rows,
              "",
              `<sub>\`codex-security verify-fix\` 0.1.26 · model \`openai/gpt-5.6-terra\` via Vercel AI Gateway · read-only checkout of \`${head}\` · ${profile} · [run](${process.env.RUN_URL})</sub>`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.head.sha !== head) {
              core.warning(`Pull request head moved to ${pr.head.sha}; not posting a result for ${head}.`);
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const prior = comments.find((c) => c.body?.includes("<!-- codex-security-verify-fix -->"));
            if (prior) await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Report the verifier's exit code
        if: steps.finding.outputs.present == 'true'
        env:
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
        run: |
          case "$VERIFY_STATUS" in
            0) echo "verify-fix: fixed" ;;
            1) echo "::error::verify-fix: still_vulnerable"; exit 1 ;;
            *) echo "::warning::verify-fix: inconclusive (exit $VERIFY_STATUS)"; exit "$VERIFY_STATUS" ;;
          esac
