name: DeepSec review comment

on:
  workflow_run:
    workflows: ["DeepSec review"]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Correlate exact run and post review comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5, default branch only
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install DeepSec and the Garnet plugin
        working-directory: .garnet-demo/runtime-review
        run: npm ci --no-fund --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deepsec-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .garnet-demo/runtime-review/artifacts
      - name: Correlate findings with the exact Garnet run
        working-directory: .garnet-demo/runtime-review
        env:
          GARNET_API_TOKEN: ${{ secrets.GARNET_API_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          npx deepsec garnet-correlate \
            --findings artifacts/deepsec-findings.json \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" \
            --step "Exercise the reviewed path" \
            --out artifacts/garnet-correlated.json \
            --comment-out artifacts/garnet-comment.md
      - name: Post one review comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("fs");
            const root = ".garnet-demo/runtime-review/artifacts";
            const meta = JSON.parse(fs.readFileSync(`${root}/review-meta.json`, "utf8"));
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: meta.pullRequest });
            if (pr.head.sha !== run.head_sha) {
              core.setFailed(`artifact claims PR #${meta.pullRequest} at ${meta.headSha}, but run ${run.id} is for ${run.head_sha}`);
              return;
            }
            const read = (f) => fs.existsSync(`${root}/${f}`) ? fs.readFileSync(`${root}/${f}`, "utf8").trim() : "";
            const deepsec = read("deepsec-comment.md") || "DeepSec reported no findings for this diff.";
            const garnet = read("garnet-comment.md");
            const marker = "<!-- deepsec-garnet-runtime-review -->";
            const agentLabel = meta.agentNote ? `\`${meta.agent}\` (${meta.agentNote})` : `\`${meta.agent}\``;
            const footer = `<sub>DeepSec agent: ${agentLabel} · reviewed \`${run.head_sha.slice(0,7)}\` against \`${pr.base.ref}\` · Garnet run [${run.id}](${run.html_url})</sub>`;
            const body = [marker, deepsec, "---", garnet, footer].filter(Boolean).join("\n\n");
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const prior = comments.find((c) => c.body?.includes(marker));
            if (prior) await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
