name: DeepSec review

on:
  pull_request:
    paths:
      - ".garnet-demo/runtime-review/**"
      - ".github/workflows/deepsec-review.yml"
      - ".github/workflows/deepsec-review-comment.yml"

permissions: {}

jobs:
  review:
    name: DeepSec review + runtime exercise
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
        with:
          fetch-depth: 0

      - name: Garnet Runtime Review
        uses: garnet-org/action@e546567a72e4fede11ec39d6e9f75b539adef22c # main 2026-09-04
        with:
          jibril_version: v2.17.0-rc.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install DeepSec and the Garnet plugin
        working-directory: .garnet-demo/runtime-review
        run: npm ci --no-fund --no-audit

      - name: Review the pull request diff with DeepSec
        id: deepsec
        working-directory: .garnet-demo/runtime-review
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          review() {
            model_flag=""
            if [ "$1" = deterministic-review-fixture ]; then model_flag="--model no-model-fixture"; fi
            set +e
            # shellcheck disable=SC2086
            npx deepsec process \
              --diff "origin/$BASE_REF" \
              --root ../.. \
              --project-id dub-runtime-review-demo \
              --agent "$1" $model_flag \
              --comment-out deepsec-comment.md 2>&1 | tee deepsec-process.log
            status=${PIPESTATUS[0]}
            set -e
            case "$status" in 0|1) ;; *) exit "$status" ;; esac
          }
          agent=codex
          agent_note=""
          if [ -z "$AI_GATEWAY_API_KEY" ]; then agent=deterministic-review-fixture; agent_note="no AI_GATEWAY_API_KEY"; fi
          review "$agent"
          # DeepSec reports "0 findings" when the model backend fails; fall back to the labeled fixture instead of publishing a false negative.
          if [ "$agent" = codex ] && grep -qE "Errored batches: [1-9]|Codex (SDK|turn|stream) (error|failed)" deepsec-process.log; then
            agent_note="codex unavailable: $(grep -oE 'status [0-9]{3}[^)]*' deepsec-process.log | head -1 | tr -d '"\\' | cut -c1-80)"
            agent=deterministic-review-fixture
            rm -f deepsec-comment.md
            review "$agent"
          fi
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          if [ ! -e deepsec-comment.md ]; then touch deepsec-comment.md; fi
          npx deepsec export --project-id dub-runtime-review-demo --format json --out deepsec-findings.json
          printf '{"pullRequest":%s,"headSha":"%s","agent":"%s","agentNote":"%s","findingsExit":%s}\n' \
            "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}" "$agent" "$agent_note" "$status" > review-meta.json

      - name: Exercise the reviewed path
        working-directory: .garnet-demo/runtime-review
        env:
          PREVIEW_TARGET_URL: https://example.com/garnet-deepsec-demo
        run: node webhook-preview.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deepsec-review
          path: |
            .garnet-demo/runtime-review/deepsec-comment.md
            .garnet-demo/runtime-review/deepsec-findings.json
            .garnet-demo/runtime-review/review-meta.json
          retention-days: 7
