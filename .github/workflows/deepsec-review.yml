name: DeepSec review

on:
  pull_request:
    paths:
      - ".garnet-demo/runtime-review/**"
      - ".github/workflows/deepsec-review.yml"

permissions: {}

jobs:
  review:
    name: DeepSec review + runtime exercise
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
        with:
          fetch-depth: 0

      - name: Garnet Runtime Review
        uses: garnet-org/action@e546567a72e4fede11ec39d6e9f75b539adef22c # main 2026-09-04
        with:
          jibril_version: v2.17.0-rc.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install DeepSec and the Garnet plugin
        working-directory: .garnet-demo/runtime-review
        run: npm install --no-fund --no-audit

      - name: Review the pull request diff with DeepSec
        id: deepsec
        working-directory: .garnet-demo/runtime-review
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          agent=codex
          if [ -z "$AI_GATEWAY_API_KEY" ]; then agent=deterministic-review-fixture; fi
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          set +e
          npx deepsec process \
            --diff "origin/$BASE_REF" \
            --root ../.. \
            --project-id dub-runtime-review-demo \
            --agent "$agent" \
            --comment-out deepsec-comment.md
          status=$?
          set -e
          case "$status" in 0|1) ;; *) exit "$status" ;; esac
          if [ ! -e deepsec-comment.md ]; then touch deepsec-comment.md; fi
          npx deepsec export --project-id dub-runtime-review-demo --format json --out deepsec-findings.json
          printf '{"pullRequest":%s,"headSha":"%s","agent":"%s","findingsExit":%s}\n' \
            "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}" "$agent" "$status" > review-meta.json

      - name: Exercise the reviewed path
        working-directory: .garnet-demo/runtime-review
        env:
          PREVIEW_TARGET_URL: https://example.com/garnet-deepsec-demo
        run: node webhook-preview.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: deepsec-review
          path: |
            .garnet-demo/runtime-review/deepsec-comment.md
            .garnet-demo/runtime-review/deepsec-findings.json
            .garnet-demo/runtime-review/review-meta.json
          retention-days: 7
